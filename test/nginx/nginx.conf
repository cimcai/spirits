##############################################################################
# nginx reverse proxy for the Mastodon interop test environment
#
#  spirits.test:443   → http://spirits:5000
#  mastodon.test:443  → http://mastodon-web:3000
#
# TLS certificates are generated by test/nginx/gen-certs.sh and mounted at
# /etc/nginx/certs/ by docker-compose.
##############################################################################

events {
    worker_connections 1024;
}

http {
    # ── spirits.test ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name spirits.test;

        ssl_certificate     /etc/nginx/certs/spirits.test.crt;
        ssl_certificate_key /etc/nginx/certs/spirits.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://spirits:5000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    # ── mastodon.test ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name mastodon.test;

        ssl_certificate     /etc/nginx/certs/mastodon.test.crt;
        ssl_certificate_key /etc/nginx/certs/mastodon.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Mastodon requires larger bodies for media uploads
        client_max_body_size 40M;

        location / {
            proxy_pass            http://mastodon-web:3000;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto https;
            proxy_read_timeout    300s;
            # WebSocket support (for Mastodon streaming)
            proxy_http_version    1.1;
            proxy_set_header      Upgrade           $http_upgrade;
            proxy_set_header      Connection        "upgrade";
        }
    }
}
